<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>แดชบอร์ดเจ้าหน้าที่ | ยืมคืนกล้อง</title><link rel="stylesheet" href="/static/style.css"></head><body><header class="topbar"><a class="brand" href="/">ยืมคืนกล้อง</a><nav class="nav"><a href="/">จองอุปกรณ์</a><a class="active" href="/admin">แดชบอร์ดเจ้าหน้าที่</a><a href="/logout">ออกจากระบบ</a></nav></header><main class="container"><div class="toolbar"><h1>แดชบอร์ดเจ้าหน้าที่</h1><button class="btn btn-amber" id="checkBtn">ตรวจสอบค่าปรับและแจ้งเตือน LINE</button></div><div class="flash-area" id="flash-area"></div>
<section class="panel"><h2>เพิ่มผู้มีสิทธิ์ยืม</h2><form id="userForm" class="form-grid"><div class="field"><label class="lbl">รหัสนักศึกษา / รหัสผู้ยืม</label><input id="newSid" required maxlength="50"></div><div class="field"><label class="lbl">ชื่อ-นามสกุล</label><input id="newName" required maxlength="200"></div><div class="field full"><button class="btn" type="submit">สร้างผู้ยืมและ PIN</button></div></form><p class="notice">PIN จะแสดงครั้งเดียวหลังสร้าง กรุณามอบให้เจ้าของรหัสโดยตรง</p></section>
<div class="stats" id="stats" hidden><div class="stat"><span id="statTotal" class="stat-num">0</span><span class="stat-label">รายการทั้งหมด</span></div><div class="stat"><span id="statOverdue" class="stat-num">0</span><span class="stat-label">เลยกำหนด</span></div><div class="stat"><span id="statFine" class="stat-num">0</span><span class="stat-label">ค่าปรับสะสม (บาท)</span></div></div><div class="table-wrap"><table><thead><tr><th>ผู้ยืม</th><th>อุปกรณ์</th><th>วันที่ยืม</th><th>กำหนดคืน</th><th>วันที่คืน</th><th>ค่าปรับ</th><th>สถานะ</th><th>การทำงาน</th></tr></thead><tbody id="tbody"></tbody></table></div></main><script src="/static/app.js"></script><script>
async function load(){const r=await api('/api/records');if(r.status===401)return location='/admin';const rows=r.data.records||[];document.querySelector('#tbody').innerHTML=rows.map(x=>{const s=statusOf(x);return `<tr><td>${esc(x.full_name)}<span class="sub">${esc(x.student_id)}</span></td><td>${esc(x.equipment_name)}</td><td>${fmtDate(x.borrow_date)}</td><td>${fmtDate(x.due_date)}</td><td>${fmtDate(x.return_date)}</td><td>${money(x.fine_amount)}</td><td><span class="badge ${s.cls}">${s.label}</span>${x.notified&&!x.return_date?'<span class="sub">แจ้ง LINE แล้ว</span>':''}</td><td>${x.return_date?'-':`<button class="btn btn-sm ret" data-id="${x.record_id}">รับคืน</button>`}</td></tr>`}).join('')||'<tr><td colspan="8">ยังไม่มีรายการ</td></tr>';const overdue=rows.filter(x=>x.is_overdue&&!x.return_date).length;document.querySelector('#statTotal').textContent=rows.length;document.querySelector('#statOverdue').textContent=overdue;document.querySelector('#statFine').textContent=money(rows.reduce((a,x)=>a+Number(x.fine_amount||0),0));document.querySelector('#stats').hidden=false;}
document.querySelector('#userForm').onsubmit=async e=>{e.preventDefault();const r=await api('/api/admin/users',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({student_id:document.querySelector('#newSid').value,name:document.querySelector('#newName').value})});if(r.ok){showMessage('success',`สร้างผู้ยืม ${r.data.student_id} สำเร็จ — PIN: ${r.data.booking_pin} (แสดงครั้งเดียว)`,{clear:true});e.target.reset();}else showMessage('error',r.data.message||'สร้างผู้ยืมไม่สำเร็จ',{clear:true});};
document.querySelector('#tbody').onclick=async e=>{const b=e.target.closest('.ret');if(!b||!confirm('ยืนยันการรับคืน?'))return;const r=await api('/api/return/'+b.dataset.id,{method:'POST'});showMessage(r.ok?'success':'error',r.data.message||'ดำเนินการแล้ว',{clear:true});load();};document.querySelector('#checkBtn').onclick=async()=>{const r=await api('/api/check',{method:'POST'});showMessage(r.ok?'success':'error',r.ok?`พบเลยกำหนด ${r.data.overdue_count} รายการ ส่ง LINE ใหม่ ${r.data.notified_count} รายการ`:r.data.message,{clear:true});load();};load();
</script></body></html>
