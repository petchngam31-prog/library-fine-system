<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>แดชบอร์ดเจ้าหน้าที่ | ยืมคืนกล้อง</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header class="topbar">
  <a class="brand" href="/"><span class="brand-logo"></span>ยืมคืนกล้อง</a>
  <nav class="nav">
    <a href="/">จองอุปกรณ์</a>
    <a href="/history.html">ประวัติการยืม</a>
    <a class="active" href="/admin">แดชบอร์ดเจ้าหน้าที่</a>
    <a href="/logout" style="color: #e74c3c; font-weight: bold; margin-left: 10px;">🚪 ออกจากระบบ</a>
  </nav>
</header>

<main class="container">
  <div class="toolbar">
    <h1>รายการยืม-คืนอุปกรณ์</h1>
    <button type="button" class="btn btn-amber" id="checkBtn">ตรวจสอบค่าปรับและแจ้งเตือน LINE</button>
  </div>

  <div class="flash-area" id="flash-area"></div>

  <div class="stats" id="stats" hidden>
    <div class="stat"><span class="stat-num" id="statTotal">0</span><span class="stat-label">รายการทั้งหมด</span></div>
    <div class="stat"><span class="stat-num" id="statOverdue">0</span><span class="stat-label">เลยกำหนด</span></div>
    <div class="stat"><span class="stat-num" id="statFine">0</span><span class="stat-label">ค่าปรับสะสม (บาท)</span></div>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>ผู้ยืม</th><th>อุปกรณ์</th><th>วันที่ยืม</th><th>กำหนดคืน</th>
          <th>วันที่คืน</th><th class="num">ค่าปรับ</th><th>สถานะ</th><th>การทำงาน</th>
        </tr>
      </thead>
      <tbody id="tbody"><tr><td class="loading" colspan="8">กำลังโหลดข้อมูล...</td></tr></tbody>
    </table>
  </div>
</main>

<script src="/static/config.js"></script>
<script src="/static/app.js"></script>
<script>
  // วาดตารางข้อมูลการยืม-คืน
  function render(records) {
    const rows = [...records].sort((a, b) => b.record_id - a.record_id);
    const tbody = document.querySelector("#tbody");

    if (tbody) {
      tbody.innerHTML = rows.length
        ? rows.map((r) => {
            const st = typeof statusOf === "function" ? statusOf(r) : { cls: "borrowing", label: "กำลังยืม" };
            const fine = Number(r.fine_amount || 0);
            const name = typeof esc === "function" ? esc(r.full_name) : r.full_name;
            const eqName = typeof esc === "function" ? esc(r.equipment_name) : r.equipment_name;
            const fDate = typeof fmtDate === "function" ? fmtDate : (d) => d || "-";
            const fMoney = typeof money === "function" ? money : (m) => m;

            return `
            <tr>
              <td>${name}${r.student_id ? `<span class="sub">${r.student_id}</span>` : ""}</td>
              <td>${eqName}</td>
              <td>${fDate(r.borrow_date)}</td>
              <td>${fDate(r.due_date)}</td>
              <td>${fDate(r.return_date)}</td>
              <td class="num ${fine > 0 ? "fine-due" : ""}">${fMoney(fine)}</td>
              <td><span class="badge ${st.cls}">${st.label}</span>${r.notified && st.cls !== "returned" ? '<span class="sub">แจ้ง LINE แล้ว</span>' : ""}</td>
              <td>${st.cls === "returned" ? "-" : `<button type="button" class="btn btn-sm btn-return" data-id="${r.record_id}">รับคืน</button>`}</td>
            </tr>`;
          }).join("")
        : '<tr><td class="empty-row" colspan="8">ยังไม่มีรายการยืม-คืนในระบบ</td></tr>';
    }

    const overdue = rows.filter((r) => !r.return_date && r.is_overdue).length;
    if (document.querySelector("#statTotal")) document.querySelector("#statTotal").textContent = rows.length;
    if (document.querySelector("#statOverdue")) {
      const el = document.querySelector("#statOverdue");
      el.textContent = overdue;
      el.classList.toggle("fine-due", overdue > 0);
    }
    if (document.querySelector("#statFine")) {
      const totalFine = rows.reduce((s, r) => s + Number(r.fine_amount || 0), 0);
      document.querySelector("#statFine").textContent = typeof money === "function" ? money(totalFine) : totalFine;
    }
    if (document.querySelector("#stats")) document.querySelector("#stats").hidden = false;
  }

  // โหลดรายการประวัติการยืมจาก API Backend
  async function loadRecords() {
    try {
      const res = await fetch("/api/records", { headers: { "Accept": "application/json" } });
      
      if (res.status === 401) {
        // ถ้า Session หลุดหรือไม่ได้รับสิทธิ์ ให้ส่งกลับไปหน้าล็อกอิน
        window.location.href = "/admin";
        return;
      }

      const data = await res.json();
      if (res.ok) {
        render(data.records || []);
      } else {
        document.querySelector("#tbody").innerHTML = '<tr><td class="empty-row" colspan="8">โหลดข้อมูลไม่สำเร็จ</td></tr>';
      }
    } catch (e) {
      console.error(e);
      document.querySelector("#tbody").innerHTML = '<tr><td class="empty-row" colspan="8">เกิดข้อผิดพลาดในการเชื่อมต่อเซิร์ฟเวอร์</td></tr>';
    }
  }

  // ปุ่ม "รับคืน"
  document.querySelector("#tbody")?.addEventListener("click", async (e) => {
    const btn = e.target.closest(".btn-return");
    if (!btn) return;
    if (!confirm("ยืนยันการรับคืนอุปกรณ์รายการนี้?")) return;

    btn.disabled = true;
    btn.textContent = "กำลังบันทึก...";
    
    try {
      const res = await fetch(`/api/return/${btn.dataset.id}`, { method: "POST" });
      const data = await res.json();
      if (res.ok) {
        const fine = Number(data.fine_amount || 0);
        if (typeof showMessage === "function") {
          showMessage("success", data.message + (fine > 0 ? ` — เลยกำหนด ${data.days_late} วัน ค่าปรับ ${money(fine)} บาท` : ""), { clear: true });
        }
      } else {
        if (typeof showMessage === "function") showMessage("error", data.message || "รับคืนไม่สำเร็จ", { clear: true });
      }
    } catch (err) {
      alert("เกิดข้อผิดพลาดในการรับคืน");
    }
    loadRecords();
  });

  // ปุ่ม "ตรวจสอบค่าปรับและแจ้งเตือน LINE"
  document.querySelector("#checkBtn")?.addEventListener("click", async () => {
    const btn = document.querySelector("#checkBtn");
    btn.disabled = true;
    btn.textContent = "กำลังตรวจสอบ...";
    
    try {
      const res = await fetch("/api/check", { method: "POST" });
      const data = await res.json();
      btn.disabled = false;
      btn.textContent = "ตรวจสอบค่าปรับและแจ้งเตือน LINE";

      if (!res.ok) {
        if (typeof showMessage === "function") showMessage("error", data.message || "ตรวจสอบไม่สำเร็จ", { clear: true });
        return;
      }
      const { overdue_count, notified_count } = data;
      if (typeof showMessage === "function") {
        showMessage("success", `ตรวจสอบค่าปรับสำเร็จ — พบรายการเลยกำหนด ${overdue_count} รายการ แจ้งเตือน LINE สำเร็จ ${notified_count} รายการ`, { clear: true });
      }
    } catch (err) {
      btn.disabled = false;
      btn.textContent = "ตรวจสอบค่าปรับและแจ้งเตือน LINE";
      alert("เกิดข้อผิดพลาดในการตรวจสอบ");
    }
    loadRecords();
  });

  loadRecords();
</script>
</body>
</html>
