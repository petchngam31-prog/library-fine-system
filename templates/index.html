<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>แดชบอร์ดเจ้าหน้าที่ | ยืมคืนกล้อง</title><link rel="stylesheet" href="/static/style.css"></head><body><header class="topbar"><a class="brand" href="/">ยืมคืนกล้อง</a><nav class="nav"><a href="/">จองอุปกรณ์</a><a class="active" href="/admin">แดชบอร์ดเจ้าหน้าที่</a><a href="/logout">ออกจากระบบ</a></nav></header><main class="container"><div class="toolbar"><h1>แดชบอร์ดเจ้าหน้าที่</h1><button class="btn btn-amber" id="checkBtn">ตรวจสอบค่าปรับและแจ้ง LINE</button></div><div id="flash-area"></div><section class="panel"><h2>ระบบผู้ยืมอัตโนมัติ</h2><p>ผู้ยืมสมัครและยืนยันตัวตนผ่าน LINE ได้เองจากหน้าจอง เจ้าหน้าที่ไม่ต้องสร้างบัญชีหรือแจก PIN</p></section><div class="stats" id="stats" hidden><div class="stat"><span id="statTotal" class="stat-num">0</span><span class="stat-label">รายการทั้งหมด</span></div><div class="stat"><span id="statOverdue" class="stat-num">0</span><span class="stat-label">เลยกำหนด</span></div><div class="stat"><span id="statFine" class="stat-num">0</span><span class="stat-label">ค่าปรับสะสม (บาท)</span></div></div><div class="table-wrap"><table><thead><tr><th>ผู้ยืม</th><th>อุปกรณ์</th><th>วันที่ยืม</th><th>กำหนดคืน</th><th>วันที่คืน</th><th>ค่าปรับ</th><th>สถานะ</th><th>การทำงาน</th></tr></thead><tbody id="tbody"></tbody></table></div></main><script src="/static/app.js"></script><script>
async function load(){const r=await api('/api/records');if(r.status===401)return location='/admin';const rows=r.data.records||[];document.querySelector('#tbody').innerHTML=rows.map(x=>{const s=statusOf(x);let actions=x.return_date?'-':`<button class="btn btn-sm ret" data-id="${x.record_id}">รับคืน</button>`;if(x.return_date&&Number(x.fine_amount)>0&&!x.fine_paid)actions=`<button class="btn btn-sm pay" data-id="${x.record_id}">บันทึกชำระค่าปรับ</button>`;return `<tr><td>${esc(x.full_name)}<span class="sub">${esc(x.student_id)}</span></td><td>${esc(x.equipment_name)}</td><td>${fmtDate(x.borrow_date)}</td><td>${fmtDate(x.due_date)}</td><td>${fmtDate(x.return_date)}</td><td>${money(x.fine_amount)}${x.fine_paid?'<span class="sub">ชำระแล้ว</span>':''}</td><td><span class="badge ${s.cls}">${s.label}</span>${x.notified&&!x.return_date?'<span class="sub">แจ้ง LINE แล้ว</span>':''}</td><td>${actions}</td></tr>`}).join('')||'<tr><td colspan="8">ยังไม่มีรายการ</td></tr>';document.querySelector('#statTotal').textContent=rows.length;document.querySelector('#statOverdue').textContent=rows.filter(x=>x.is_overdue&&!x.return_date).length;document.querySelector('#statFine').textContent=money(rows.filter(x=>!x.fine_paid).reduce((a,x)=>a+Number(x.fine_amount||0),0));document.querySelector('#stats').hidden=false}
document.querySelector('#tbody').onclick=async e=>{const ret=e.target.closest('.ret'),pay=e.target.closest('.pay');if(ret){if(!confirm('ยืนยันการรับคืน?'))return;const r=await api('/api/return/'+ret.dataset.id,{method:'POST'});showMessage(r.ok?'success':'error',r.data.message||'ดำเนินการแล้ว',{clear:true});load()}else if(pay){if(!confirm('ยืนยันว่าได้รับชำระค่าปรับแล้ว?'))return;const r=await api('/api/pay-fine/'+pay.dataset.id,{method:'POST'});showMessage(r.ok?'success':'error',r.data.message||'ดำเนินการแล้ว',{clear:true});load()}};document.querySelector('#checkBtn').onclick=async()=>{const r=await api('/api/check',{method:'POST'});showMessage(r.ok?'success':'error',r.ok?`พบเลยกำหนด ${r.data.overdue_count} รายการ ส่ง LINE ใหม่ ${r.data.notified_count} รายการ`:r.data.message,{clear:true});load()};load();
</script></body></html>
