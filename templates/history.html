<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ประวัติการยืม | Demo</title><link rel="stylesheet" href="/static/style.css"></head><body><header class="topbar"><a class="brand" href="/">ยืมคืนกล้อง</a><nav class="nav"><a href="/">จองอุปกรณ์</a><a class="active" href="/history.html">ประวัติการยืม</a><a href="/admin">แดชบอร์ดเจ้าหน้าที่</a></nav></header><main class="container"><p class="notice">Demo สาธารณะ: ใช้ข้อมูลสมมติร่วมกันเท่านั้น</p><h1>ประวัติการยืม</h1><form class="search-bar" id="searchForm"><input type="text" id="userId" placeholder="รหัสทดลอง เช่น 00012345" required><button type="submit" class="btn btn-amber">ดูประวัติ</button></form><div class="table-wrap" id="tableWrap" hidden><table><thead><tr><th>อุปกรณ์</th><th>วันที่ยืม</th><th>กำหนดคืน</th><th>วันที่คืน</th><th>ค่าปรับ</th></tr></thead><tbody id="tbody"></tbody></table></div></main><script src="/static/app.js"></script><script>document.querySelector('#searchForm').addEventListener('submit',async e=>{e.preventDefault();const q=document.querySelector('#userId').value.trim();const r=await fetch('/api/history?student_id='+encodeURIComponent(q));const d=await r.json();const rows=d.records||[];document.querySelector('#tableWrap').hidden=false;document.querySelector('#tbody').innerHTML=rows.length?rows.map(x=>`<tr><td>${esc(x.equipment_name)}</td><td>${fmtDate(x.borrow_date)}</td><td>${fmtDate(x.due_date)}</td><td>${fmtDate(x.return_date)}</td><td>${money(x.fine_amount||0)}</td></tr>`).join(''):'<tr><td colspan="5">ไม่พบประวัติ Demo</td></tr>';});</script></body></html>
