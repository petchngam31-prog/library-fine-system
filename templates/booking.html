<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>จองอุปกรณ์ | ยืมคืนกล้อง</title><link rel="stylesheet" href="/static/style.css"><style>.line-setup{margin-top:16px;padding:20px;border:2px solid #06c755;border-radius:14px;background:#f4fff7}.line-setup h2{margin-top:0}.link-code{font-size:30px;font-weight:700;letter-spacing:3px;text-align:center;padding:14px;margin:12px 0;background:#fff;border:1px dashed #888;border-radius:10px}.line-steps{line-height:1.8}.copy-btn{margin-bottom:8px}.linked-ok{margin-top:16px;padding:16px;border-radius:12px;background:#f4fff7}.linked-ok strong{color:#087c37}</style></head><body>
<header class="topbar"><a class="brand" href="/">ยืมคืนกล้อง</a><nav class="nav"><a class="active" href="/">จองอุปกรณ์</a><a href="/history.html">ประวัติการยืม</a><a href="/admin">แดชบอร์ดเจ้าหน้าที่</a></nav></header>
<main class="container"><div class="flash-area" id="flash-area"></div><div id="lineResult"></div><form id="bookForm"><div class="layout"><div><section><h2>เลือกอุปกรณ์</h2><div class="chips" id="chips"></div><input class="search" id="search" placeholder="ค้นหาอุปกรณ์"><div class="grid" id="grid">กำลังโหลด...</div></section><section class="panel"><h2>ข้อมูลการจอง</h2><div class="form-grid"><div class="field"><label class="lbl">รหัสผู้ยืม</label><input id="user_id" required placeholder="รหัสนักศึกษา/รหัสผู้ยืม"></div><div class="field"><label class="lbl">PIN 6 หลัก</label><input id="booking_pin" type="password" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required placeholder="PIN ที่ได้รับจากเจ้าหน้าที่"></div><div class="field"><label class="lbl">วันที่รับ</label><input id="start_date" type="date" required></div><div class="field"><label class="lbl">วันที่คืน</label><input id="end_date" type="date" required></div><div class="field full"><label class="lbl">วัตถุประสงค์การยืม</label><input id="purpose" maxlength="500" placeholder="เช่น ถ่ายงานรายวิชา"></div></div></section></div><aside class="side"><div class="panel summary"><h2 id="summaryTitle">รายการที่เลือก (0)</h2><ul class="summary-list" id="summaryList"></ul><button class="btn btn-block" type="submit" id="submitBtn">ยืนยันการขอยืม</button></div><div class="panel line-card"><h2>แจ้งเตือนทาง LINE</h2><p>ถ้ายังไม่เคยเชื่อม LINE ระบบจะแนะนำวิธีเชื่อมหลังจองสำเร็จ โดยทำเพียงครั้งเดียว</p><a class="btn btn-line btn-block" href="https://lin.ee/S1A0Px6" target="_blank" rel="noopener">เพิ่มเพื่อน LINE</a></div></aside></div></form></main>
<script src="/static/app.js"></script><script>
const LINE_URL='https://lin.ee/S1A0Px6';const IM={1:"/static/canon.jpeg",2:"/static/fancier.jpeg",3:"/static/nikon.jpeg",4:"/static/canon_700d.jpeg",5:"/static/panasonic.jpeg",6:"/static/sony_tripod.jpeg"};let equipment=[],selected=new Set(),cat="all";const el=s=>document.querySelector(s);
async function load(){const r=await api('/api/equipment');equipment=r.ok?r.data.equipment:[];draw();}
function draw(){const cats=[...new Set(equipment.map(x=>x.category))];el('#chips').innerHTML=`<button type="button" class="chip active" data-c="all">ทั้งหมด</button>`+cats.map(c=>`<button type="button" class="chip" data-c="${esc(c)}">${esc(c)}</button>`).join('');el('#grid').innerHTML=equipment.map(x=>`<label class="card" data-cat="${esc(x.category)}" data-name="${esc(x.equipment_name.toLowerCase())}"><input type="checkbox" value="${x.equipment_id}"><div class="card-img"><img src="${IM[x.equipment_id]||''}" alt=""></div><div class="card-body"><h3>${esc(x.equipment_name)}</h3><p class="stock">พร้อมให้ยืม</p></div></label>`).join('');}
function summary(){el('#summaryTitle').textContent=`รายการที่เลือก (${selected.size})`;el('#summaryList').innerHTML=[...selected].map(id=>`<li>${esc((equipment.find(x=>String(x.equipment_id)===id)||{}).equipment_name||id)}</li>`).join('')||'<li>ยังไม่ได้เลือกอุปกรณ์</li>';}
el('#grid').addEventListener('change',e=>{if(e.target.type!=='checkbox')return;e.target.checked?selected.add(e.target.value):selected.delete(e.target.value);summary();});el('#chips').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;cat=b.dataset.c;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x===b));filter();});el('#search').addEventListener('input',filter);function filter(){const q=el('#search').value.toLowerCase();document.querySelectorAll('.card').forEach(x=>x.hidden=!((cat==='all'||x.dataset.cat===cat)&&x.dataset.name.includes(q)));}
const today=new Date().toISOString().slice(0,10);el('#start_date').min=today;el('#end_date').min=today;el('#start_date').onchange=e=>el('#end_date').min=e.target.value||today;
function showLineResult(d){const box=el('#lineResult');if(d.line_linked){box.innerHTML='<div class="linked-ok"><strong>✓ จองสำเร็จ และ LINE เชื่อมไว้แล้ว</strong><br>ไม่ต้องทำอะไรเพิ่ม ระบบจะส่งการแจ้งเตือนไปยัง LINE ที่เชื่อมไว้</div>';return;}const code=esc(d.line_link_code||'');box.innerHTML=`<div class="line-setup"><h2>จองสำเร็จ ✓ เหลืออีก 1 ขั้นตอน</h2><p><strong>คุณยังไม่ได้เชื่อม LINE</strong> เชื่อมเพียงครั้งเดียวเพื่อรับการแจ้งเตือนกำหนดคืนและค่าปรับ</p><div class="line-steps"><b>1.</b> กดปุ่ม “เพิ่มเพื่อน LINE” ด้านล่าง<br><b>2.</b> คัดลอกข้อความนี้<div class="link-code">ผูก ${code}</div><button type="button" class="btn btn-outline btn-block copy-btn" id="copyLine">คัดลอกข้อความ</button><b>3.</b> เปิดแชต LINE OA แล้ววางข้อความ จากนั้นกดส่ง</div><a class="btn btn-line btn-block" href="${LINE_URL}" target="_blank" rel="noopener">เพิ่มเพื่อน / เปิด LINE OA</a><p style="margin-bottom:0"><small>รหัสนี้ใช้ได้ครั้งเดียวและหมดอายุภายใน 15 นาที หลังเชื่อมสำเร็จ การจองครั้งต่อไปจะไม่ต้องทำขั้นตอนนี้อีก</small></p></div>`;el('#copyLine').onclick=async()=>{const text='ผูก '+(d.line_link_code||'');try{await navigator.clipboard.writeText(text);el('#copyLine').textContent='คัดลอกแล้ว ✓';}catch(e){prompt('คัดลอกข้อความนี้',text);}};box.scrollIntoView({behavior:'smooth',block:'start'});}
el('#bookForm').addEventListener('submit',async e=>{e.preventDefault();if(!selected.size)return alert('กรุณาเลือกอุปกรณ์');const start=el('#start_date').value,end=el('#end_date').value;if(end<start)return alert('วันที่คืนต้องไม่ก่อนวันที่รับ');const btn=el('#submitBtn');btn.disabled=true;btn.textContent='กำลังบันทึก...';el('#flash-area').innerHTML='';el('#lineResult').innerHTML='';try{const r=await fetch('/api/book',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:el('#user_id').value.trim(),booking_pin:el('#booking_pin').value.trim(),equipment_ids:[...selected].map(Number),start_date:start,end_date:end,purpose:el('#purpose').value.trim()})});const d=await r.json();if(!r.ok){showMessage('error',d.message||'จองไม่สำเร็จ');return;}showMessage('success','บันทึกการจองสำเร็จ');showLineResult(d);selected.clear();document.querySelectorAll('.card input').forEach(x=>x.checked=false);summary();}catch(err){showMessage('error','เกิดข้อผิดพลาดในการเชื่อมต่อเซิร์ฟเวอร์');}finally{btn.disabled=false;btn.textContent='ยืนยันการขอยืม';}});summary();load();
</script></body></html>
