<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>จองอุปกรณ์ | ยืมคืนกล้อง</title><link rel="stylesheet" href="/static/style.css"><style>.verify{padding:20px;border:2px solid #06c755;border-radius:14px;background:#f4fff7;margin-bottom:18px}.code{font-size:26px;font-weight:700;text-align:center;padding:14px;background:#fff;border:1px dashed #777;border-radius:10px;margin:10px 0}.hidden{display:none!important}.ok{padding:14px;background:#f4fff7;border-radius:12px;margin-bottom:16px;color:#087c37;font-weight:700}</style></head><body><header class="topbar"><a class="brand" href="/">ยืมคืนกล้อง</a><nav class="nav"><a class="active" href="/">จองอุปกรณ์</a><a href="/history.html">ประวัติการยืม</a><a href="/admin">เจ้าหน้าที่</a></nav></header><main class="container"><div id="flash-area"></div><section class="panel" id="identity"><h2>1. ยืนยันตัวตนด้วย LINE</h2><p>สมัครและยืนยันได้ด้วยตัวเอง ไม่ต้องขอ PIN จากเจ้าหน้าที่</p><div class="form-grid"><div class="field"><label class="lbl">รหัสนักศึกษา / รหัสผู้ยืม</label><input id="student_id" required placeholder="กรอกรหัสของคุณ"></div><div class="field"><label class="lbl">ชื่อ-นามสกุล</label><input id="name" placeholder="ผู้ใช้ใหม่กรอกชื่อ-นามสกุล"></div></div><button class="btn" type="button" id="verifyBtn">ยืนยันผ่าน LINE</button><div id="verifyBox"></div></section><div id="verified" class="ok hidden">✓ ยืนยันตัวตนผ่าน LINE สำเร็จ สามารถจองอุปกรณ์ได้</div><form id="bookForm" class="hidden"><div class="layout"><div><section><h2>2. เลือกอุปกรณ์</h2><div class="chips" id="chips"></div><input class="search" id="search" placeholder="ค้นหาอุปกรณ์"><div class="grid" id="grid">กำลังโหลด...</div></section><section class="panel"><h2>3. ข้อมูลการจอง</h2><div class="form-grid"><div class="field"><label class="lbl">วันที่รับ</label><input id="start_date" type="date" required></div><div class="field"><label class="lbl">วันที่คืน</label><input id="end_date" type="date" required></div><div class="field full"><label class="lbl">วัตถุประสงค์</label><input id="purpose" maxlength="500" placeholder="เช่น ถ่ายงานรายวิชา"></div></div></section></div><aside class="side"><div class="panel summary"><h2 id="summaryTitle">รายการที่เลือก (0)</h2><ul id="summaryList" class="summary-list"></ul><button class="btn btn-block" id="submitBtn">ยืนยันการจอง</button></div></aside></div></form></main><script src="/static/app.js"></script><script>
const LINE='https://lin.ee/S1A0Px6',IM={1:'/static/canon.jpeg',2:'/static/fancier.jpeg',3:'/static/nikon.jpeg',4:'/static/canon_700d.jpeg',5:'/static/panasonic.jpeg',6:'/static/sony_tripod.jpeg'};let equipment=[],selected=new Set(),cat='all',poll=null;const el=s=>document.querySelector(s);
async function load(){const r=await api('/api/equipment');equipment=r.ok?r.data.equipment:[];draw()}
function draw(){const cats=[...new Set(equipment.map(x=>x.category))];el('#chips').innerHTML='<button type="button" class="chip active" data-c="all">ทั้งหมด</button>'+cats.map(c=>`<button type="button" class="chip" data-c="${esc(c)}">${esc(c)}</button>`).join('');el('#grid').innerHTML=equipment.map(x=>`<label class="card" data-cat="${esc(x.category)}" data-name="${esc(x.equipment_name.toLowerCase())}"><input type="checkbox" value="${x.equipment_id}"><div class="card-img"><img src="${IM[x.equipment_id]||''}" alt=""></div><div class="card-body"><h3>${esc(x.equipment_name)}</h3><p class="stock">พร้อมให้ยืม</p></div></label>`).join('')}
function summary(){el('#summaryTitle').textContent=`รายการที่เลือก (${selected.size})`;el('#summaryList').innerHTML=[...selected].map(id=>`<li>${esc((equipment.find(x=>String(x.equipment_id)===id)||{}).equipment_name||id)}</li>`).join('')||'<li>ยังไม่ได้เลือกอุปกรณ์</li>'}
el('#verifyBtn').onclick=async()=>{const b=el('#verifyBtn');b.disabled=true;const r=await fetch('/api/line/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({student_id:el('#student_id').value.trim(),name:el('#name').value.trim()})});const d=await r.json();b.disabled=false;if(!r.ok)return showMessage('error',d.message||'เริ่มยืนยันไม่สำเร็จ');const text=d.line_instruction;el('#verifyBox').innerHTML=`<div class="verify"><h3>${d.line_linked?'ยืนยันด้วย LINE ที่เคยเชื่อม':'เชื่อม LINE ครั้งแรก'}</h3><p>1. กดเปิด LINE OA<br>2. คัดลอกข้อความด้านล่างแล้วส่งในแชต<br>3. กลับมาหน้านี้ ระบบจะตรวจให้อัตโนมัติ</p><div class="code">${esc(text)}</div><button type="button" class="btn btn-outline" id="copy">คัดลอกข้อความ</button> <a class="btn btn-line" href="${LINE}" target="_blank" rel="noopener">เปิด LINE OA</a><p><small>รหัสหมดอายุใน 15 นาที</small></p></div>`;el('#copy').onclick=()=>navigator.clipboard.writeText(text).then(()=>el('#copy').textContent='คัดลอกแล้ว ✓');clearInterval(poll);poll=setInterval(checkVerified,2000)};
async function checkVerified(){const r=await fetch('/api/line/verify');const d=await r.json();if(d.verified){clearInterval(poll);el('#identity').classList.add('hidden');el('#verified').classList.remove('hidden');el('#bookForm').classList.remove('hidden');showMessage('success','ยืนยันตัวตนสำเร็จ') }}
el('#grid').addEventListener('change',e=>{if(e.target.type!=='checkbox')return;e.target.checked?selected.add(e.target.value):selected.delete(e.target.value);summary()});el('#chips').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;cat=b.dataset.c;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x===b));filter()});el('#search').addEventListener('input',filter);function filter(){const q=el('#search').value.toLowerCase();document.querySelectorAll('.card').forEach(x=>x.hidden=!((cat==='all'||x.dataset.cat===cat)&&x.dataset.name.includes(q)))}
const today=new Date().toISOString().slice(0,10);el('#start_date').min=today;el('#end_date').min=today;el('#start_date').onchange=e=>el('#end_date').min=e.target.value||today;
el('#bookForm').addEventListener('submit',async e=>{e.preventDefault();if(!selected.size)return alert('กรุณาเลือกอุปกรณ์');const start=el('#start_date').value,end=el('#end_date').value;if(end<start)return alert('วันที่คืนต้องไม่ก่อนวันที่รับ');const b=el('#submitBtn');b.disabled=true;const r=await fetch('/api/book',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({equipment_ids:[...selected].map(Number),start_date:start,end_date:end,purpose:el('#purpose').value.trim()})});const d=await r.json();b.disabled=false;if(!r.ok)return showMessage('error',d.message||'จองไม่สำเร็จ');showMessage('success','✓ จองอุปกรณ์สำเร็จ ระบบจะส่งการแจ้งเตือนผ่าน LINE ที่ยืนยันไว้');selected.clear();document.querySelectorAll('.card input').forEach(x=>x.checked=false);summary()});summary();load();
</script></body></html>
